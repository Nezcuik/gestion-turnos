<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Verifica tu correo - Gestión de Turnos</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        h2 { color: #007bff; margin-bottom: 15px; }
        p { color: #555; line-height: 1.5; font-size: 1rem; margin-bottom: 20px; }
        .btn-login { display: inline-block; background: #28a745; color: white; padding: 10px 20px; border-radius: 4px; text-decoration: none; font-size: 1rem; font-weight: bold; }
        .btn-login:hover { background: #218838; }
    </style>
</head>
<body>
    <div class="card">
        <h2>¡Registro exitoso! ✉️</h2>
        <p>Te hemos enviado un enlace de verificación a tu correo electrónico.</p>
        <p>Por favor, revisa tu bandeja de entrada (o la consola de pruebas si estás usando Ethereal) para activar tu cuenta.</p>        
        <a href="index.html" class="btn-login">Ir a Iniciar Sesión</a>
    </div>
</body>
</html>
