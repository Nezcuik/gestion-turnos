<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Paciente - Gestión de Turnos</title>
    <link rel="stylesheet" href="css/registro.css">
</head>
<body>
    <div class="card">
        <h2>Crear Cuenta</h2>
        <form id="formRegistro">
            <div class="form-group">
                <label>DNI:</label>
                <input type="number" id="dni_paciente" required>
            </div>
            <div class="form-group">
                <label>Nombre:</label>
                <input type="text" id="nombre_paciente" required>
            </div>
            <div class="form-group">
                <label>Apellido:</label>
                <input type="text" id="apellido_paciente" required>
            </div>
            <div class="form-group">
                <label>Fecha de Nacimiento:</label>
                <input type="date" id="fec_nac_paciente" required>
            </div>
            <div class="form-group">
                <label>Correo Electrónico:</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Contraseña (mínimo 8 caracteres):</label>
                <input type="password" id="password" required minlength="8">
            </div>
            <button type="submit">Registrarse</button>
        </form>
        <div id="resultado" class="mensaje"></div>
        <a href="index.html">Ya tenes una cuenta? inicia sesion...</a></p>
    </div>
    <script src="js/registro.js"></script>
</body>
</html>
